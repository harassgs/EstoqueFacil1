<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estoque Fácil{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('user_id') %}
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">📦 Estoque Fácil</a>
  <nav><a href="{{ url_for('dashboard') }}">Painel</a><a href="{{ url_for('products') }}">Produtos</a><a href="{{ url_for('movements') }}">Movimentações</a></nav>
  <form method="post" action="{{ url_for('logout') }}"><button class="btn ghost">Sair</button></form>
</header>
{% endif %}
<main class="container">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body></html>
